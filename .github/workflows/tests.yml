name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.yml
          activate-environment: iav-transport
          auto-activate: false
          conda-remove-defaults: true
      - name: Run paper-facing tests
        run: PYTHONPATH=. python -m pytest -q tests --disable-warnings
